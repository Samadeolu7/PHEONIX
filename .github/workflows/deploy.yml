name: Build & Deploy Phoenix KTI

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/phoenix-kti-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/phoenix-kti-frontend

jobs:
  # ── 1. Build & push backend image ──────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./erp-backend/phoenix_erp
          dockerfile: ./erp-backend/phoenix_erp/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=inline

  # ── 2. Build & push frontend image ─────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./erp-frontend
          dockerfile: ./erp-frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.kti.krystartrust.ng/api
            VITE_API_BASE_URL=https://api.kti.krystartrust.ng/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline

  # ── 3. Deploy to server via SSH ─────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/phoenix-kti
      - name: Debug workspace
        run: |
            pwd
            find . -name "docker-compose.yml"
      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "erp-backend/phoenix_erp/docker-compose.yml"
          target: "/opt/phoenix-kti/"
          strip_components: 2

      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Keep timeout generous — migration + health-wait can take a few minutes
          command_timeout: 10m
          script: |
            set -e
            cd /opt/phoenix-kti

            echo "==> Pulling latest images (old containers keep serving)..."
            docker compose pull

            echo "==> Ensuring postgres is healthy before migrations..."
            PGID=$(docker compose ps -q postgres)
            for i in $(seq 1 18); do
              PGSTATUS=$(docker inspect --format='{{.State.Health.Status}}' "$PGID" 2>/dev/null || echo "starting")
              echo "  attempt $i/18: postgres=$PGSTATUS"
              if [ "$PGSTATUS" = "healthy" ]; then break; fi
              if [ "$i" = "18" ]; then echo "ERROR: postgres not healthy" && docker compose logs --tail=30 postgres && exit 1; fi
              sleep 5
            done

            echo "==> Running migrations with new image while old backend is live..."
            # NOTE: The backend service has entrypoint=["/bin/sh","-c"], so we MUST override
            # the entrypoint here. Without --entrypoint, docker merges to:
            #   /bin/sh -c sh -c "migrate..."
            # which runs 'sh' as the command string (not the migrate commands) and exits 0,
            # silently skipping all migrations.
            docker compose run --rm --no-deps \
              --entrypoint /bin/sh \
              -e DJANGO_SETTINGS_MODULE=phoenix.settings \
              -e PYTHONPATH=/app/src \
              backend \
              -c "set -e; cd /app/src; python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py createcachetable 2>/dev/null || true"

            echo "==> Restarting backend (migrate is already done — startup is fast)..."
            docker compose up -d --no-deps --force-recreate backend

            echo "==> Waiting for backend to pass health check..."
            BACKEND_ID=$(docker compose ps -q backend)
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$BACKEND_ID" 2>/dev/null || echo "starting")
              echo "  attempt $i/30: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "  Backend is healthy — continuing"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "  ERROR: backend did not become healthy in time"
                docker compose logs --tail=50 backend
                exit 1
              fi
              sleep 6
            done

            echo "==> Restarting Celery workers and flower..."
            docker compose up -d --no-deps --force-recreate celery_worker celery_beat flower

            echo "==> Restarting frontend (nginx — nearly instant)..."
            docker compose up -d --no-deps --force-recreate frontend

            echo "==> Removing orphaned containers..."
            docker compose up -d --remove-orphans

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deployment complete. Running containers:"
            docker compose ps
