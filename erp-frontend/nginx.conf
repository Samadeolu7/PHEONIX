server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # ---------------- API ----------------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # ------------- STATIC ASSETS (FIRST) -------------
    # Vite outputs to _assets/ to avoid conflicting with the /assets/* app routes
    location /_assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------- JS / ESM MODULES (CRITICAL) -------------
    # Include .tsx here because the Vite build produced some module files with .tsx extension
    # Force a JS MIME type for anything matching this location (especially .tsx)
    location ~* \.(js|mjs|tsx)$ {
        default_type application/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static files (icons, fonts, etc.)
    location ~* \.(css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------- SPA FALLBACK (LAST) -------------
    location / {
        try_files $uri /index.html;
    }
}
