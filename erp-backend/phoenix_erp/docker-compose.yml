name: phoenix_kti

services:
  postgres:
    image: postgres:15-alpine
    container_name: phoenix_kti_postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - kti_postgres_data:/var/lib/postgresql/data
    networks:
      - phoenix_kti_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: phoenix_kti_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - kti_redis_data:/data
    networks:
      - phoenix_kti_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_IMAGE_BACKEND:-samadeolu7/phoenix-kti-backend:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
          cd /app/src
          exec gunicorn phoenix.wsgi:application \
            --bind 0.0.0.0:8000 \
            --workers 3 \
            --worker-class gthread \
            --threads 2 \
            --timeout 120 \
            --preload \
            --access-logfile - \
            --error-logfile -
    environment:
      - DJANGO_SETTINGS_MODULE=phoenix.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - REDIS_URL=redis://redis:6379/1
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - PYTHONPATH=/app/src
    volumes:
      - kti_static_files:/app/src/staticfiles
      - kti_media_files:/app/src/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          python -c "
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://localhost:8000/api/common/health/', timeout=4)
              sys.exit(0)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code == 429 else 1)
          except Exception:
              sys.exit(1)
          "
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
    networks:
      - phoenix_kti_backend
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phoenix-kti-api.rule=Host(`api.kti.krystartrust.ng`)"
      - "traefik.http.routers.phoenix-kti-api.entrypoints=websecure"
      - "traefik.http.routers.phoenix-kti-api.tls=true"
      - "traefik.http.routers.phoenix-kti-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.phoenix-kti-api.loadbalancer.server.port=8000"
      - "traefik.http.services.phoenix-kti-api.loadbalancer.healthcheck.path=/api/common/health/"
      - "traefik.http.services.phoenix-kti-api.loadbalancer.healthcheck.interval=10s"
      - "traefik.docker.network=traefik_public"

  # Real-time WebSocket notifications/thread updates (Django Channels) — a
  # separate daphne process rather than switching `backend` above to an
  # ASGI/uvicorn worker, so the existing gunicorn/WSGI HTTP path (which all
  # current production traffic relies on) is completely untouched. Traefik
  # routes only the /ws path prefix here; every other request keeps going
  # to `backend`. Shares the same image/DB/Redis as `backend`.
  backend_ws:
    image: ${DOCKER_IMAGE_BACKEND:-samadeolu7/phoenix-kti-backend:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
          cd /app/src
          exec daphne -b 0.0.0.0 -p 8001 phoenix.asgi:application
    environment:
      - DJANGO_SETTINGS_MODULE=phoenix.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - PYTHONPATH=/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # Same reasoning as celery_worker/celery_beat below — wait for
        # entrypoint.sh's migrate step (via backend's healthcheck) so this
        # never queries against a stale/mid-migration schema.
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - phoenix_kti_backend
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phoenix-kti-ws.rule=Host(`api.kti.krystartrust.ng`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.phoenix-kti-ws.entrypoints=websecure"
      - "traefik.http.routers.phoenix-kti-ws.tls=true"
      - "traefik.http.routers.phoenix-kti-ws.tls.certresolver=letsencrypt"
      # Explicit priority (rather than relying on Traefik's implicit
      # rule-length ordering) so /ws always wins over the plain Host(...)
      # rule on the `backend` service above, even if either rule changes.
      - "traefik.http.routers.phoenix-kti-ws.priority=10"
      - "traefik.http.services.phoenix-kti-ws.loadbalancer.server.port=8001"
      - "traefik.docker.network=traefik_public"

  celery_worker:
    image: ${DOCKER_IMAGE_BACKEND:-samadeolu7/phoenix-kti-backend:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /app/src
        exec python -m celery -A phoenix worker --loglevel=info --concurrency=2
    environment:
      - DJANGO_SETTINGS_MODULE=phoenix.settings
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - PYTHONPATH=/app/src
      # Bank-Recon (Java) call — only celery_worker needs these, since
      # banks.tasks.run_reconciliation_match is what actually calls it,
      # not the gunicorn/backend process.
      - BANK_RECON_SERVICE_URL=${BANK_RECON_SERVICE_URL}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # service_healthy (not service_started): the backend container's
        # healthcheck only passes once gunicorn is serving, which is only
        # after entrypoint.sh's `migrate` step completes. celery_worker and
        # celery_beat bypass entrypoint.sh and never migrate themselves, so
        # this is what stops them from starting against a stale schema.
        condition: service_healthy
    networks:
      - phoenix_kti_backend

  celery_beat:
    image: ${DOCKER_IMAGE_BACKEND:-samadeolu7/phoenix-kti-backend:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /app/src
        exec python -m celery -A phoenix beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=phoenix.settings
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - PYTHONPATH=/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # service_healthy (not service_started): the backend container's
        # healthcheck only passes once gunicorn is serving, which is only
        # after entrypoint.sh's `migrate` step completes. celery_worker and
        # celery_beat bypass entrypoint.sh and never migrate themselves, so
        # this is what stops them from starting against a stale schema.
        condition: service_healthy
    networks:
      - phoenix_kti_backend

  flower:
    image: ${DOCKER_IMAGE_BACKEND:-samadeolu7/phoenix-kti-backend:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /app/src
        exec python -m celery -A phoenix flower --port=5555
    environment:
      - DJANGO_SETTINGS_MODULE=phoenix.settings
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - PYTHONPATH=/app/src
    depends_on:
      - redis
      - celery_worker
    networks:
      - phoenix_kti_backend
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phoenix-kti-flower.rule=Host(`flower.kti.krystartrust.ng`)"
      - "traefik.http.routers.phoenix-kti-flower.entrypoints=websecure"
      - "traefik.http.routers.phoenix-kti-flower.tls=true"
      - "traefik.http.routers.phoenix-kti-flower.tls.certresolver=letsencrypt"
      - "traefik.http.services.phoenix-kti-flower.loadbalancer.server.port=5555"
      - "traefik.docker.network=traefik_public"

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-samadeolu7/phoenix-kti-frontend:latest}
    restart: unless-stopped
    networks:
      - traefik_public
      - phoenix_kti_backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phoenix-kti-frontend.rule=Host(`erp.krystartrust.ng`)"
      - "traefik.http.routers.phoenix-kti-frontend.entrypoints=websecure"
      - "traefik.http.routers.phoenix-kti-frontend.tls=true"
      - "traefik.http.routers.phoenix-kti-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.phoenix-kti-frontend.tls.domains[0].main=erp.krystartrust.ng"
      - "traefik.http.services.phoenix-kti-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.phoenix-kti-frontend-http.rule=Host(`erp.krystartrust.ng`)"
      - "traefik.http.routers.phoenix-kti-frontend-http.entrypoints=web"
      - "traefik.http.routers.phoenix-kti-frontend-http.middlewares=kti-redirect-to-https"
      - "traefik.http.middlewares.kti-redirect-to-https.redirectscheme.scheme=https"
networks:
  phoenix_kti_backend:
    driver: bridge
    # Explicit name (not the Compose-project-prefixed default) so the
    # separate Bank-Recon compose stack can join it via `external: true`
    # without needing to guess the auto-generated name.
    name: phoenix_kti_backend
  traefik_public:
    external: true
    name: traefik_public
volumes:
  kti_postgres_data:
    external: true
    name: phoenix-kti_kti_postgres_data
  kti_redis_data:
  kti_static_files:
  kti_media_files: